[project]
name = "taskflow"
version = "0.1.0"
description = ""
authors = [
    {name = "Mehdi Radfar",email = "81019265+funlifew@users.noreply.github.com"}
]
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "django (>=6.0.6,<7.0.0)",
    "python-decouple (>=3.8,<4.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "redis (>=8.0.1,<9.0.0)",
    "hiredis (>=3.4.0,<4.0.0)",
    "django-redis (>=7.0.0,<8.0.0)",
    "gunicorn (>=26.0.0,<27.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "django-debug-toolbar (>=7.0.0,<8.0.0)",
    "django-redisboard (>=9.0.0,<10.0.0)",
    "ipython (>=9.16.1,<10.0.0)",
    "ruff (>=0.16.3,<0.17.0)"
]

[tool.ruff]
line-length = 88
exclude = [
    '.git',
    '.idea',
    '.venv',
    '.vscode',
    '__pycache__',
    'staticfiles',
    'media',
    'test-media',
    'migrations',
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.lint.per-file-ignores]
"config/settings/development.py" = ["F403", "F405"]
"config/settings/production.py" = ["F403", "F405"]
"config/settings/test.py" = ["F403", "F405"]