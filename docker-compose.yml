name: taskflow

services:
  db:
    image: postgres:18-alpine

    environment:
      POSTGRES_DB: ${DB_NAME:-taskflow}
      POSTGRES_USER: ${DB_USER:-taskflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-taskflow}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  redis:
    image: redis:8-alpine

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s


  web:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env.docker

    init: true

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    expose:
      - "8000"

    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    stop_grace_period: 30s


  nginx:
    image: nginx:stable-alpine

    depends_on:
      web:
        condition: service_healthy

    ports:
      - "${APP_PORT:-8000}:80"

    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/srv/taskflow/static:ro
      - media_data:/srv/taskflow/media:ro


volumes:
  postgres_data:
  static_data:
  media_data: