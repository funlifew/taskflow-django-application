<nav
  class="mobile-bottom-nav glass-panel"
  aria-label="ناوبری سریع موبایل"
>
  <a
    class="mobile-bottom-nav__item{% if request.resolver_match.namespace == 'dashboard' and request.resolver_match.url_name == 'dashboard' %} active{% endif %}"
    data-nav="dashboard"
    href="{% url 'dashboard:dashboard' %}"
    {% if request.resolver_match.namespace == "dashboard" and request.resolver_match.url_name == "dashboard" %}
      aria-current="page"
    {% endif %}
  >
    <svg
      class="tf-icon"
      aria-hidden="true"
      focusable="false"
    >
      <use href="#icon-home"></use>
    </svg>

    <span>
      خانه
    </span>
  </a>

  <a
    class="mobile-bottom-nav__item{% if request.resolver_match.namespace == 'workspaces' or request.resolver_match.namespace == 'boards' or request.resolver_match.namespace == 'columns' or request.resolver_match.namespace == 'tasks' %} active{% endif %}"
    data-nav="workspaces"
    href="{% url 'workspaces:list' %}"
    {% if request.resolver_match.namespace == "workspaces" or request.resolver_match.namespace == "boards" or request.resolver_match.namespace == "columns" or request.resolver_match.namespace == "tasks" %}
      aria-current="page"
    {% endif %}
  >
    <svg
      class="tf-icon"
      aria-hidden="true"
      focusable="false"
    >
      <use href="#icon-workspace"></use>
    </svg>

    <span>
      فضاها
    </span>
  </a>

  <a
    class="mobile-bottom-nav__item mobile-bottom-nav__item--create"
    href="{% url 'workspaces:create' %}"
    aria-label="ساخت فضای کاری"
  >
    <span class="mobile-bottom-nav__create-icon">
      <svg
        class="tf-icon"
        aria-hidden="true"
        focusable="false"
      >
        <use href="#icon-plus"></use>
      </svg>
    </span>

    <span>
      ساخت
    </span>
  </a>

  <a
    class="mobile-bottom-nav__item{% if request.resolver_match.namespace == 'dashboard' and request.resolver_match.url_name != 'dashboard' or request.resolver_match.namespace == 'accounts' and request.resolver_match.url_name == 'change_password' %} active{% endif %}"
    data-nav="profile"
    href="{% url 'dashboard:profile' %}"
    {% if request.resolver_match.namespace == "dashboard" and request.resolver_match.url_name != "dashboard" or request.resolver_match.namespace == "accounts" and request.resolver_match.url_name == "change_password" %}
      aria-current="page"
    {% endif %}
  >
    <svg
      class="tf-icon"
      aria-hidden="true"
      focusable="false"
    >
      <use href="#icon-user"></use>
    </svg>

    <span>
      پروفایل
    </span>
  </a>

  <button
    class="mobile-bottom-nav__item"
    type="button"
    data-drawer-open
    aria-label="باز کردن منوی بیشتر"
    aria-controls="mobile-navigation-drawer"
    aria-expanded="false"
  >
    <svg
      class="tf-icon"
      aria-hidden="true"
      focusable="false"
    >
      <use href="#icon-menu"></use>
    </svg>

    <span>
      بیشتر
    </span>
  </button>
</nav>
