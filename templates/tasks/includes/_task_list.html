<div
  class="task-dropzone{% if not tasks %} is-empty{% endif %}"
  data-task-list
  data-column-id="{{ column.pk }}"
  aria-label="Taskهای ستون {{ column.title }}"
>
  {% for task in tasks %}
    {% include "tasks/includes/_task_card.html" with task=task can_drag_tasks=can_drag_tasks %}
  {% endfor %}

  <p
    class="card-text task-list-empty"
    data-task-empty
    {% if tasks %}hidden{% endif %}
  >
    هنوز Task فعالی در این ستون وجود ندارد.
  </p>
</div>
